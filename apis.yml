aid: ubitricity
name: Ubitricity
description: >-
  Ubitricity is a Berlin-based electric vehicle charging company and wholly-owned
  subsidiary of Shell, best known for integrating EV charge points into existing
  street infrastructure such as lampposts and bollards. It operates the UK's
  largest public on-street charging network, with further networks in Germany and
  France, providing charge point hardware (Simple Socket lamppost units, AC and DC
  chargers), a managed charging platform built on the Open Charge Point Protocol
  (OCPP), and Pay-As-You-Go driver charging. The company does not currently
  publish a public developer API or developer portal.
